<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHALUPÁRKA – načítava sa</title><style>html,body{height:100%;margin:0;background:#173a22;color:#fff;font-family:system-ui;display:grid;place-items:center}.box{text-align:center}.logo{font-size:clamp(34px,7vw,84px);font-weight:900;color:#f7b72d;text-shadow:0 4px 0 #7a3d0d}.bar{width:min(70vw,520px);height:16px;border-radius:99px;background:#42280f;border:3px solid #d89b32;overflow:hidden;margin:24px auto}.fill{height:100%;width:0;background:linear-gradient(90deg,#72c72c,#b2ef45);transition:width .2s}.small{opacity:.85}</style></head><body><div class="box"><div class="logo">CHALUPÁRKA</div><div class="bar"><div class="fill" id="f"></div></div><div id="s" class="small">Načítavam online dvor…</div></div><script>(async()=>{const count=10;let html='';for(let i=0;i<count;i++){const p=String(i).padStart(3,'0');const r=await fetch('./payload/part-'+p+'.txt',{cache:'no-cache'});if(!r.ok)throw new Error('Časť '+p+' sa nenačítala');html+=await r.text();document.getElementById('f').style.width=((i+1)/count*100)+'%'}document.open();document.write(html);document.close()})().catch(e=>{document.getElementById('s').textContent='Nepodarilo sa načítať hru. Obnov stránku. '+e.message})</script></body></html>
