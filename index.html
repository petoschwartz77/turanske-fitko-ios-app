(()=>{'use strict';const KEY='chaluparka_online_v024';const initial={level:1,xp:0,wood:8,coins:280,stage:0,active:null,mail:[],done:[],projects:[{name:'CHALUPÁRKA HQ',icon:'🏡'},{name:'Turanské Fitko App',icon:'🏋️'},{name:'NECTARIA',icon:'🐝'},{name:'KÓD HRIVY',icon:'🐴'}],chats:{'CHALUPÁRKA HQ':''}};let state=load();const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function load(){try{return {...structuredClone(initial),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(initial)}}function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1900)}function timeMode(){const h=new Date().getHours();return h<6||h>=21?'night':h>=18?'dusk':'day'}function applyTime(){const m=timeMode();['#splashScene','#yardScene'].forEach(x=>{$(x).classList.remove('night','dusk');if(m!=='day')$(x).classList.add(m)})}function go(id){$$('.screen').forEach(x=>x.classList.toggle('active',x.id===id));close();render()}function render(){applyTime();$('#level').textContent=state.level;$('#xp').textContent=state.xp;$('#wood').textContent=state.wood;$('#coins').textContent=state.coins;$('#mailBadge').textContent=state.mail.filter(x=>!x.read).length;const names=['Zabudnutá chalupa','Obnova sa rozbehla','Chalupa opäť dýcha','Živá usadlosť'];$('#stageName').textContent=names[Math.min(state.stage,3)];$('#mainMission').textContent=state.active?'AI majster pracuje: '+state.active.action+' – '+state.active.area:state.stage<1?'Hlavná práca: Zmapovať stav starej chalupy':'Ďalší krok: dokončiť prácu a obnoviť ďalšiu časť dvora'}function open(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('open')}function close(){$('#modal').classList.remove('open')}function area(name){open(name,`<div class="cards"><div class="card"><h3>Čo chceš spraviť?</h3><p>Vyber jednu jasnú úlohu. Výsledok príde do Pošty.</p><div class="row">${['Pokračovať','Opraviť','Vylepšiť','Analyzovať','Naplánovať'].map(a=>`<button class="small-btn" data-start="${a}" data-area="${name}">${a}</button>`).join('')}</div></div><div class="card"><b>Bezpečný režim:</b> toto online demo neposiela žiadne dáta ani API kľúče mimo prehliadača.</div></div>`)}function start(area,action){if(state.active)return toast('Najprv dokonči rozpracovanú úlohu.');state.active={area,action,started:Date.now()};save();close();toast('AI majster začal pracovať.');setTimeout(()=>{if(!state.active)return;state.mail.unshift({id:Date.now(),area,action,read:false,text:`Pripravil som návrh pre oblasť ${area}. Odporúčam urobiť jeden malý merateľný krok, skontrolovať výsledok a až potom pokračovať ďalej.`});state.active=null;save();toast('Výsledok je pripravený v Pošte.');},2600)}function panel(type){if(type==='mail'){const rows=state.mail.length?state.mail.map(m=>`<div class="card"><h3>${esc(m.action)} – ${esc(m.area)}</h3><p>${esc(m.text)}</p><div class="row"><button class="small-btn" data-accept="${m.id}">Prijať a dokončiť</button><button class="small-btn brown" data-read="${m.id}">Označiť prečítané</button></div></div>`).join(''):'<div class="empty">📭 Pošta je zatiaľ prázdna.</div>';open('Pošta',`<div class="cards">${rows}</div>`)}else if(type==='tasks'){open('Úlohy',`<div class="cards"><div class="card"><h3>${state.active?'Rozpracované':'Pripravené'}</h3><p>${state.active?esc(state.active.action+' – '+state.active.area):'Klikni na budovu na dvore a vyber prácu.'}</p></div><div class="card"><h3>Dokončené: ${state.done.length}</h3><div class="progress"><i style="--p:${Math.min(100,state.done.length*20)}%"></i></div></div></div>`)}else if(type==='projects'){open('Projekty',`<div class="cards">${state.projects.map(p=>`<div class="card"><h3>${p.icon} ${esc(p.name)}</h3><button class="small-btn" data-project="${esc(p.name)}">Otvoriť projekt</button></div>`).join('')}</div>`)}else if(type==='settings'){const url=state.chats['CHALUPÁRKA HQ']||'';open('Nastavenia',`<div class="card"><h3>Deň a noc</h3><p>Automaticky podľa miestneho času zariadenia: <b>${timeMode()}</b>.</p></div><div class="card"><h3>Chat CHALUPÁRKA HQ</h3><label>Odkaz na tvoj ChatGPT chat</label><input id="chatUrl" value="${esc(url)}" placeholder="https://chatgpt.com/c/..."><div class="row" style="margin-top:10px"><button class="small-btn" id="saveChat">Uložiť odkaz</button>${url?'<button class="small-btn brown" id="openChat">Otvoriť chat</button>':''}</div><p><small>Odkaz ostáva iba v tomto prehliadači.</small></p></div><div class="card"><button class="small-btn red" id="resetGame">Začať odznova</button></div>`)}else if(type==='team'){open('Tím','<div class="card"><h3>👥 Tím</h3><p>Ďalší krok: pridať ľudí, úlohy a schvaľovanie. Gazda zostáva pri konečnom rozhodnutí.</p></div>')}else if(type==='book'){open('Kniha prác',`<div class="cards">${state.done.length?state.done.map(x=>`<div class="card"><b>✅ ${esc(x.action)} – ${esc(x.area)}</b><p>${new Date(x.at).toLocaleString('sk-SK')}</p></div>`).join(''):'<div class="empty">Zatiaľ tu nie je žiadna dokončená práca.</div>'}</div>`)}}function accept(id){const m=state.mail.find(x=>x.id==id);if(!m)return;state.done.unshift({area:m.area,action:m.action,at:Date.now()});state.mail=state.mail.filter(x=>x.id!=id);state.xp+=35;state.coins+=40;state.wood+=3;if(state.xp>=100){state.level++;state.xp-=100}state.stage=Math.min(3,Math.floor(state.done.length/2)+1);save();panel('mail');toast('Práca dokončená. Chalupa ožila!')}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.panel)panel(b.dataset.panel);if(b.dataset.area)area(b.dataset.area);if(b.dataset.start)start(b.dataset.area,b.dataset.start);if(b.dataset.accept)accept(b.dataset.accept);if(b.dataset.read){const m=state.mail.find(x=>x.id==b.dataset.read);if(m)m.read=true;save();panel('mail')}if(b.dataset.project)toast('Projekt '+b.dataset.project+' je pripravený.');if(b.id==='closeModal')close();if(b.id==='saveChat'){const v=$('#chatUrl').value.trim();if(v&&!/^https:\/\/chatgpt\.com\//i.test(v))return toast('Použi platný odkaz chatgpt.com.');state.chats['CHALUPÁRKA HQ']=v;save();toast('Odkaz uložený.');panel('settings')}if(b.id==='openChat'){const u=state.chats['CHALUPÁRKA HQ'];if(u)window.open(u,'_blank','noopener,noreferrer')}if(b.id==='resetGame'&&confirm('Naozaj začať odznova?')){localStorage.removeItem(KEY);state=structuredClone(initial);save();close();toast('Dvor bol obnovený na začiatok.')}});$('#closeModal').addEventListener('click',close);$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});setInterval(applyTime,60000);render()})();
</script></body></html>
