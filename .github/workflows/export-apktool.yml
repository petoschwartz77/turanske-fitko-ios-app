name: Export Apktool

on:
  push:
    branches:
      - android-toolchain-temp
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download official Apktool release
        run: |
          curl -L --fail --retry 3 \
            -o apktool_3.0.3.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool_3.0.3.jar" | sha256sum -c -
      - name: Upload tool
        uses: actions/upload-artifact@v4
        with:
          name: apktool-3.0.3
          path: apktool_3.0.3.jar
          if-no-files-found: error
          retention-days: 1
